server:
  port: 8080
  shutdown: graceful

spring:
  data:
    redis:
      connect-timeout: 500ms
      timeout: 500ms
  rabbitmq:
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
  application:
    name: ipage-ims
  datasource:
    # 默认 PostgreSQL：论文域的正式数据在这里。
    # 想用免安装的本地文件库：--spring.profiles.active=h2（空库会自动灌内置演示数据）。
    url: jdbc:postgresql://127.0.0.1:5432/ipage_ims
    driver-class-name: org.postgresql.Driver
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:123456}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      # 前端构建产物放到 classpath:/static 后由同一个端口托管
      cache:
        period: 3600

ims:
  # 生产环境务必用环境变量覆盖：openssl rand -base64 32
  secret: ${IMS_SECRET:ipage-ims-dev-secret-please-change-in-production}
  token-ttl-hours: 12
  seed: true
  sync-schema: true

  redis:
    enabled: ${IMS_REDIS_ENABLED:false}
    key-prefix: ${IMS_REDIS_KEY_PREFIX:ipage-ims}
    brand-ttl-seconds: ${IMS_REDIS_BRAND_TTL_SECONDS:60}

  rabbitmq:
    enabled: ${IMS_RABBITMQ_ENABLED:false}
    queue: ${IMS_RABBITMQ_QUEUE:ims.business.events}

  ai:
    available: true # false 时移除管理入口，并停用对话
    max-tokens: 2048
    # 单次请求的上下文上限（tokens），按所选模型的能力设置。
    # 超了会报「Context budget exceeded」；模型窗口更小时请调低。
    context-budget: ${IMS_AI_CONTEXT_BUDGET:300000}
    work-dir: ./data/ai

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ./logs/ims.log
  logback:
    rollingpolicy:
      file-name-pattern: '${logging.file.name}.%d{yyyy-MM-dd}.%i.gz'
      max-file-size: 20MB
      # 历史日志统一由数据库保留策略清理。
      max-history: 0
  level:
    root: info
    com.rabbitc.ims: info
    com.rabbitc.ipage: warn
